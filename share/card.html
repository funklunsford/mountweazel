<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mountweazel share card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,800;1,6..72,400&family=UnifrakturMaguntia&display=block">
<style>
/* The wide link preview: 1200 × 630. `npm run share-card` renders it to card.png (see also square.html).
   It says what the game is, in plain words, under the nameplate. No words from any page. */
:root {
  --newsprint: #ecebe5;
  --ink: #161514;
  --ink-2: #57544d;
  --dele: #ae2a1f;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { background: var(--newsprint); color: var(--ink); font-family: "Newsreader", Georgia, serif; }
.card { display: flex; flex-direction: column; width: 1200px; height: 630px; padding: 38px 64px 34px; }

.nameplate { margin: 0; font-family: "UnifrakturMaguntia", serif; font-weight: 400; font-size: 118px; line-height: 1; text-align: center; }
.rule { margin-top: 18px; border-top: 5px double var(--ink); }

.lead { display: flex; flex: 1; flex-direction: column; justify-content: center; }
.kicker { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; color: var(--dele); }
.headline { margin: 12px 0 18px; font-size: 70px; font-weight: 800; line-height: 1.02; letter-spacing: -.014em; font-variation-settings: "opsz" 72; text-wrap: balance; }
.deck { margin: 0; max-width: 980px; font-size: 31px; font-style: italic; line-height: 1.34; color: var(--ink-2); text-wrap: pretty; }

.foot { display: flex; justify-content: space-between; align-items: baseline; padding-top: 12px; border-top: 1.5px solid var(--ink); font-size: 21px; }
.url { font-weight: 600; letter-spacing: .05em; }
.tag { font-style: italic; color: var(--ink-2); }
</style>
</head>
<body>
<div class="card">
  <h1 class="nameplate">The Mountweazel</h1>
  <div class="rule"></div>

  <div class="lead">
    <p class="kicker">A word puzzle</p>
    <h2 class="headline">Find the fake words hiding among real old ones.</h2>
    <p class="deck">Every real word you confirm gives you a clue about the others. Use the clues to prove which words were made up. No guessing needed.</p>
  </div>

  <footer class="foot"><span class="url">funklunsford.github.io/mountweazel</span><span class="tag">Free to play in your browser</span></footer>
</div>
</body>
</html>

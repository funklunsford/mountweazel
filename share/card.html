<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mountweazel share card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@500;700;800&display=block">
<style>
/* The wide link preview: 1200 × 630. `npm run share-card` renders it to card.png (see also square.html).
   The name and a plain statement of the game on the left, the page's mountain on the right, mid-climb.
   No words from any climb. The scene is the page's own drawing (SCENE in climb.js), which
   share/scene-svg.js writes in as static SVG between the scene comments. */
:root { --ink: #2a2140; --panel: #fffaf0; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { background: linear-gradient(180deg, #86c9e3 0, #cfe9ef 55%, #ffe9d4 100%); color: var(--ink); font-family: "Rubik", system-ui, sans-serif; }
.card { display: grid; grid-template-columns: 560px 1fr; grid-template-rows: 1fr auto; column-gap: 48px; width: 1200px; height: 630px; padding: 56px 60px 40px; }
.words { display: flex; flex-direction: column; justify-content: center; gap: 18px; }
.logo { display: flex; align-items: center; gap: 16px; margin: 0; font-family: "Lilita One", sans-serif; font-weight: 400; font-size: 84px; line-height: 1; letter-spacing: .01em; color: #fff;
  text-shadow: -5px -5px 0 var(--ink), 5px -5px 0 var(--ink), -5px 5px 0 var(--ink), 5px 5px 0 var(--ink), 0 -5px 0 var(--ink), 0 5px 0 var(--ink), -5px 0 0 var(--ink), 5px 0 0 var(--ink), 0 10px 0 var(--ink); }
.logo svg { width: 78px; height: 78px; flex: none; overflow: visible; filter: drop-shadow(0 6px 0 var(--ink)); }
.lg-mtn { fill: #fff; stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; }
.lg-pole { stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; }
.lg-flag { fill: #ff7d3b; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
.kicker { width: fit-content; margin: 6px 0 0; padding: 6px 18px; border: 4px solid var(--ink); border-radius: 999px; background: #ff7d3b; color: #fff; font-size: 22px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; box-shadow: 0 5px 0 var(--ink); }
.headline { margin: 4px 0 0; font-family: "Lilita One", sans-serif; font-weight: 400; font-size: 64px; line-height: 1.02; letter-spacing: .01em; }
.deck { margin: 0; font-size: 27px; font-weight: 500; line-height: 1.35; }
.frame { align-self: center; position: relative; height: 380px; overflow: hidden; border: 6px solid var(--ink); border-radius: 34px; background: linear-gradient(180deg, #86c9e3, #fde7cf); box-shadow: 0 10px 0 var(--ink); }
.scene { display: block; width: 100%; height: 100%; overflow: visible; }
.foot { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; padding-top: 22px; font-size: 24px; font-weight: 700; }
.url { padding: 6px 18px; border: 4px solid var(--ink); border-radius: 999px; background: var(--panel); box-shadow: 0 5px 0 var(--ink); }
.tag { color: #3d3453; }
/* The page's scene, in its daytime colours. */
.scene .sky-sun { fill: #fff1a8; }
.scene .star { display: none; }
.scene .far-1 { fill: #bccfe8; }
.scene .far-2 { fill: #a6bfe0; }
.scene .cloud { fill: #ffffff; opacity: .9; }
.scene .band-foothills { fill: #9ed27a; }
.scene .band-treeline { fill: #4fa36f; }
.scene .band-scree { fill: #b6abc4; }
.scene .band-ridge { fill: #d8ecf6; }
.scene .band-summit { fill: #ffffff; }
.scene .shade { fill: rgb(42 33 64 / .16); }
.scene .outline { fill: none; stroke: #2a2140; stroke-width: 2.5; stroke-linejoin: round; }
.scene .tree { fill: #2f7a52; stroke: #2a2140; stroke-width: 1.2; stroke-linejoin: round; }
.scene .rock { fill: #8f86a3; stroke: #2a2140; stroke-width: 1.2; stroke-linejoin: round; }
.scene .haze { fill: url(#haze); }
.scene .haze-stop { stop-color: #ffffff; }
.scene .hatch-bg { fill: #e5483d; }
.scene .hatch-fg { fill: #b8322a; }
.scene .trail { fill: none; stroke: rgb(255 255 255 / .92); stroke-width: 2; stroke-dasharray: 2 5; stroke-linecap: round; }
.scene .rope-line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.scene .rope-under { stroke: #2a2140; stroke-width: 6; }
.scene .rope-over { stroke: #f0a95b; stroke-width: 3; }
.scene .pole { stroke: #2a2140; stroke-width: 2; }
.scene .flag { fill: #ff7d3b; stroke: #2a2140; stroke-width: 1.5; stroke-linejoin: round; }
.scene .marker circle { fill: #fff; stroke: #2a2140; stroke-width: 2.5; }
.scene .marker .glyph { fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; display: none; }
.scene .marker.right circle { fill: #49b465; }
.scene .marker.wrong circle { fill: url(#hatch-wrong); }
.scene .marker.right .tick, .scene .marker.wrong .cross { display: inline; }
.scene .scout-body { fill: #ff9a3c; stroke: #2a2140; stroke-width: 1.6; }
.scene .scout-pack { fill: #9b6a3e; stroke: #2a2140; stroke-width: 1.4; }
.scene .scout-hat { fill: #b07a45; stroke: #2a2140; stroke-width: 1.4; stroke-linejoin: round; }
.scene .scout-sash { fill: none; stroke: #3fa65a; stroke-width: 2.2; }
.scene .scout-eye { fill: #fff; stroke: #2a2140; stroke-width: .8; }
.scene .scout-pupil, .scene .scout-foot { fill: #2a2140; }
</style>
</head>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mountweazel square card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,800&family=UnifrakturMaguntia&display=block">
<style>
/* The square card, 1200 × 1200: the summit badge in a double-ruled frame, with the name beneath.
   Rendered by `npm run share-card` to square.png. With #mark it shows only the icon instead, a
   newsprint tile with a snowy peak and a red flag, which the render shrinks to favicon.png and
   apple-touch-icon.png. */
:root { --newsprint: #ecebe5; --ink: #161514; --dele: #ae2a1f; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 1200px; overflow: hidden; }
body { background: var(--newsprint); color: var(--ink); }
.frame { position: absolute; inset: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; border: 16px double var(--ink); }
.badge { width: 560px; height: 560px; overflow: visible; filter: drop-shadow(14px 14px 0 var(--ink)); }
.name { margin-top: 18px; font-family: "UnifrakturMaguntia", serif; font-size: 116px; line-height: 1; }
.kicker { font-family: "Newsreader", Georgia, serif; font-size: 40px; font-weight: 800; letter-spacing: .24em; text-transform: uppercase; color: var(--dele); padding-left: .24em; }
/* The icon: one tile filling the frame, so it still reads at 64 pixels. */
.mark { display: none; }
body.only-mark .frame { display: none; }
body.only-mark .mark { display: block; width: 1200px; height: 1200px; }
</style>
</head>
<body>
<script>if (location.hash === '#mark') document.body.classList.add('only-mark');</script>
<div class="frame">
  <svg class="badge" viewBox="0 0 128 128" aria-hidden="true">
    <circle cx="64" cy="64" r="58" fill="#efc75a" stroke="#161514" stroke-width="4"/>
    <circle cx="64" cy="64" r="49" fill="none" stroke="#fbfaf5" stroke-width="2.5" stroke-dasharray="5 4"/>
    <path d="M24 92 L54 40 L66 58 L76 46 L104 92 Z" fill="#fbfaf5" stroke="#161514" stroke-width="3" stroke-linejoin="round"/>
    <line x1="54" y1="40" x2="54" y2="20" stroke="#161514" stroke-width="3"/>
    <path d="M54 20 l16 6 l-16 6 z" fill="#ae2a1f" stroke="#161514" stroke-width="2.5" stroke-linejoin="round"/>
  </svg>
  <div class="name">The Mountweazel</div>
  <div class="kicker">A word puzzle</div>
</div>
<svg class="mark" viewBox="0 0 1200 1200" aria-hidden="true">
  <defs><clipPath id="tile"><rect x="70" y="70" width="1060" height="1060"/></clipPath></defs>
  <rect x="70" y="70" width="1060" height="1060" fill="#ecebe5"/>
  <g clip-path="url(#tile)">
    <path d="M100 1010 L520 310 L700 600 L800 470 L1150 1050 L100 1050 Z" fill="#fbfaf5" stroke="#161514" stroke-width="44" stroke-linejoin="round"/>
    <path d="M60 890 Q300 830 560 890 T1160 880 V1150 H60 Z" fill="#9db98c" stroke="#161514" stroke-width="44" stroke-linejoin="round"/>
  </g>
  <line x1="520" y1="310" x2="520" y2="130" stroke="#161514" stroke-width="40" stroke-linecap="round"/>
  <path d="M520 130 L700 192 L520 254 Z" fill="#ae2a1f" stroke="#161514" stroke-width="34" stroke-linejoin="round"/>
  <rect x="70" y="70" width="1060" height="1060" fill="none" stroke="#161514" stroke-width="60"/>
</svg>
</body>
</html>

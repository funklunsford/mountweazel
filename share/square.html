<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mountweazel square card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@800&display=block">
<style>
/* The square card, 1200 × 1200: a summit merit badge with the name beneath. Rendered by
   `npm run share-card` to square.png. With #mark it shows only the icon instead, a sky tile with
   a white peak and an orange flag, which the render shrinks to favicon.png and apple-touch-icon.png. */
:root { --ink: #2a2140; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 1200px; overflow: hidden; }
body { display: grid; place-items: center; background: linear-gradient(180deg, #86c9e3 0, #cfe9ef 55%, #ffe9d4 100%); color: var(--ink); }
.card { display: grid; justify-items: center; gap: 34px; }
.badge { width: 700px; height: 700px; overflow: visible; filter: drop-shadow(0 18px 0 var(--ink)); }
.name { margin: 10px 0 0; font-family: "Lilita One", sans-serif; font-weight: 400; font-size: 150px; line-height: 1; letter-spacing: .01em; color: #fff;
  text-shadow: -8px -8px 0 var(--ink), 8px -8px 0 var(--ink), -8px 8px 0 var(--ink), 8px 8px 0 var(--ink), 0 -8px 0 var(--ink), 0 8px 0 var(--ink), -8px 0 0 var(--ink), 8px 0 0 var(--ink), 0 16px 0 var(--ink); }
.kicker { margin: 0; padding: 10px 30px; border: 6px solid var(--ink); border-radius: 999px; background: #ff7d3b; color: #fff; font-family: "Rubik", sans-serif; font-size: 40px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; box-shadow: 0 8px 0 var(--ink); }
/* The icon: the whole frame is one tile, so it still reads at 64 pixels. */
.mark { display: none; }
body.only-mark .card { display: none; }
body.only-mark .mark { display: block; width: 1200px; height: 1200px; }
</style>
</head>
<body>
<script>if (location.hash === '#mark') document.body.classList.add('only-mark');</script>
<div class="card">
  <svg class="badge" viewBox="0 0 128 128" aria-hidden="true">
    <circle cx="64" cy="64" r="58" fill="#ffc845" stroke="#2a2140" stroke-width="5"/>
    <circle cx="64" cy="64" r="49" fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="5 4" opacity=".9"/>
    <path d="M24 92 L54 40 L66 58 L76 46 L104 92 Z" fill="#fff" stroke="#2a2140" stroke-width="3" stroke-linejoin="round"/>
    <line x1="54" y1="40" x2="54" y2="20" stroke="#2a2140" stroke-width="3"/>
    <path d="M54 20 l16 6 l-16 6 z" fill="#ff7d3b" stroke="#2a2140" stroke-width="2.5" stroke-linejoin="round"/>
  </svg>
  <h1 class="name">Mountweazel</h1>
  <p class="kicker">A word game</p>
</div>
<svg class="mark" viewBox="0 0 1200 1200" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86c9e3"/><stop offset="1" stop-color="#ffe9d4"/></linearGradient>
    <clipPath id="tile"><rect x="80" y="80" width="1040" height="1040" rx="230"/></clipPath>
  </defs>
  <rect x="80" y="80" width="1040" height="1040" rx="230" fill="url(#sky)"/>
  <g clip-path="url(#tile)">
    <path d="M100 1000 L520 300 L700 590 L800 460 L1150 1040 L100 1040 Z" fill="#fff" stroke="#2a2140" stroke-width="44" stroke-linejoin="round"/>
    <path d="M60 880 Q300 820 560 880 T1160 870 V1140 H60 Z" fill="#9ed27a" stroke="#2a2140" stroke-width="44" stroke-linejoin="round"/>
  </g>
  <line x1="520" y1="300" x2="520" y2="120" stroke="#2a2140" stroke-width="40" stroke-linecap="round"/>
  <path d="M520 120 L700 182 L520 244 Z" fill="#ff7d3b" stroke="#2a2140" stroke-width="34" stroke-linejoin="round"/>
  <rect x="80" y="80" width="1040" height="1040" rx="230" fill="none" stroke="#2a2140" stroke-width="56"/>
</svg>
</body>
</html>

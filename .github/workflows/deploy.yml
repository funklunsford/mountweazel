# Every push to main (a merged pull request) is checked and published to the site,
# https://funklunsford.github.io/mountweazel/ (GitHub Pages on this repo, built by Actions).
# Pull requests are checked but not published. Only the page itself is published:
# index.html, game.js, pages.js and the images in share/ (link previews and icons), not the tools beside them.
name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push replaces a run still in progress on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check every page
        run: npm run check

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Collect the page
        run: |
          mkdir -p site/share
          cp index.html game.js pages.js site/
          cp share/*.png site/share/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
